# Local development environment for APISIX with the consent-filter plugin runner.
#
# Usage:
#   docker compose up --build
#   # then create the gated route (see README, "Local Development with Docker Compose")
#
# The stack is self-contained: APISIX and its etcd, the plugin runner, a mock
# consent-manager + OwnerResolver + token service, an upstream that returns
# personal data, and an OTel Collector to receive the access-decision audit log.
#
# Note the socket wiring. APISIX and the runner share a DIRECTORY (the
# runner-socket volume) and the socket is created inside it. Bind-mounting the
# socket file itself does not work: Docker creates a directory at that path
# before either process can bind, and the runner then fails to start.

services:
  # The upstream etcd image rather than bitnami/etcd, which was retired from the
  # public catalog and no longer resolves — `docker compose up` failed on the
  # pull. This one needs no auth-disabling env var: it is open by default, which
  # is fine for a local stack and is not a deployment example.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"

  apisix:
    image: apache/apisix:3.8.0-debian
    depends_on:
      etcd:
        condition: service_started
      plugin-runner:
        condition: service_healthy
    ports:
      - "9080:9080"   # HTTP proxy port
      - "9180:9180"   # Admin API port
    volumes:
      - ./dev/apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - runner-socket:/opt/runner
    restart: on-failure

  # A named volume is created root-owned, and the runner image runs as uid 10001,
  # so hand the socket directory over before the runner starts.
  socket-init:
    image: alpine:3.22
    command: ["chown", "10001:10001", "/opt/runner"]
    volumes:
      - runner-socket:/opt/runner

  plugin-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      socket-init:
        condition: service_completed_successfully
      mock:
        condition: service_healthy
    volumes:
      - runner-socket:/opt/runner
    environment:
      APISIX_LISTEN_ADDRESS: "unix:/opt/runner/runner.sock"
      # Credentials the plugin reads from the environment rather than the route
      # config, mirroring how the Kubernetes deployment sources them from a Secret.
      CONSENT_KEY: "dev-consent-key"
      CONSENT_TOKEN_SERVICE_URL: "http://mock:8080/internal/tokens"
      CONSENT_AUDIT_OTLP_ENDPOINT: "http://otel-collector:4318"
      # Prometheus metrics, off unless an address is set.
      CONSENT_METRICS_ADDRESS: ":9091"
    ports:
      - "9091:9091"   # Prometheus metrics
    restart: on-failure

  # Mock consent-manager, OwnerResolver and participant token service. The
  # stubs live in dev/mocks/ — edit consents.json to flip the gate's answer.
  mock:
    image: wiremock/wiremock:3.9.1
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ./dev/mocks:/home/wiremock/mappings:ro
    ports:
      - "8081:8080"
    # A malformed stub makes WireMock exit at startup, and without a healthcheck
    # that shows up only as an unexplained deny from the gate several steps
    # later. Depending services wait for this instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The upstream whose responses are gated. It echoes the request back as JSON,
  # which is enough for the OwnerResolver stub to be asked about a payload.
  upstream:
    image: mendhak/http-https-echo:34
    environment:
      HTTP_PORT: "8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./dev/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318"

volumes:
  runner-socket:
